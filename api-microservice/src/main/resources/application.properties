# ============================================================================
# Spring Boot 3.3 Microservice Configuration
# Physiotherapy Clinical Session Management REST API
# ============================================================================

# Microservice Server Port (Embedded Tomcat)
server.port=8080
server.servlet.context-path=/

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/physio_db
spring.datasource.username=postgres
spring.datasource.password=roshan123
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.pool-name=PhysioBootHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Spring Data JPA / Hibernate 6 Properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring Boot Actuator Endpoints (Unit 4.1)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Springdoc OpenAPI 3.0 & Swagger UI (Unit 4.2)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.show-actuator=true

# Jackson JSON Configuration
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
