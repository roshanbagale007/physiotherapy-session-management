# ============================================================================
# Database Configuration & HikariCP Connection Pooling
# Physiotherapy Session Management System
# ============================================================================

# --- Primary: PostgreSQL 18+ Configuration ---
db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://localhost:5432/physio_db
db.username=postgres
db.password=postgres

# --- Alternate: MySQL 8+ Configuration (Uncomment if testing on MySQL) ---
# db.driver=com.mysql.cj.jdbc.Driver
# db.url=jdbc:mysql://localhost:3306/physio_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# db.username=root
# db.password=root

# --- HikariCP Connection Pool Settings (Unit 1.8) ---
pool.maximumPoolSize=10
pool.minimumIdle=2
pool.idleTimeout=30000
pool.connectionTimeout=10000
pool.maxLifetime=600000
pool.poolName=PhysioHikariPool
